<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Exit</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Exit</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    <ion-item lines="none">
      <ion-label>
        Antes de salir, confirma la acción.
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-button expand="block" color="danger" (click)="confirmExit()">
    Salir de la app
  </ion-button>
</ion-content>
